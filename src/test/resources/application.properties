spring.config.import=optional:file:.env.test[.properties]

# Test DB
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/ecommerce_test}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:test-password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Test JPA
spring.jpa.hibernate.ddl-auto=${TEST_DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Test Logging
logging.level.org.hibernate.SQL=info
logging.level.org.hibernate.orm.jdbc.bind=off

# Test JWT
jwt.secret=${TEST_JWT_SECRET}
jwt.expiration=3600000
